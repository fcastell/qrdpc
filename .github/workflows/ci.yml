name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "**/*.md"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also caches the Gradle build cache and configuration cache (task outputs, e.g.
      # compilation, lint, detekt), not just downloaded dependencies. Pinned to the commit
      # SHA for v6.2.0. cache-encryption-key encrypts configuration-cache entries stored in
      # the GitHub Actions cache (secret generated via `openssl rand -base64 32`).
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # sdkmanager isn't on PATH by default on the ubuntu-latest runner; pinned to the
      # commit SHA for v4.0.1.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Fail-fast: fastest checks first, measured from a clean state. spotlessCheck/detekt
      # analyze sources directly (~1-2s, no compilation). test/lint compile but don't
      # trigger dex or APK packaging. assemble (dex + packaging + release minification) is
      # the heaviest task and nothing else depends on it: last.
      - run: ./gradlew spotlessCheck
      - run: ./gradlew detekt
      - run: ./gradlew test
      - run: ./gradlew lint
      # assemble (not build): build includes check (lint + detekt + test), which would run
      # twice given the dedicated steps above.
      - run: ./gradlew assemble

  release:
    needs: android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compute version from tag
        id: version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Rename APK with the app name
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/qrdpc-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release with the APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="QrDPC test build."
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/qrdpc-${GITHUB_REF_NAME}.apk" \
            --title "QrDPC $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --generate-notes
